name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tag zgodny z package.json
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} != package.json ${PKG}"; exit 1
          fi
      - run: npm run typecheck
      - run: npm run build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/avionics-cards.js
          generate_release_notes: true
